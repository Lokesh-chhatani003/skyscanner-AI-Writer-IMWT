# -----------------------------------------------------------------------------
# CONFIGURATION FOR THE SKYSCANNER AI-LQA PIPELINE (CSV / DOCX)
# Batch locales (filename codes): AE, CH, CZ, HR, JP, KR, MX, PL, TH, TR, TW
# -----------------------------------------------------------------------------

# --- API and Model Settings ---
# Note: For production, it's highly recommended to load the API key from
# an environment variable instead of storing it in this file.
api_key: "__SET_ME__"

llm_settings:
  model: "gemini-2.5-pro"
  temperature: 1

# --- File Paths ---
paths:
  input: "input"
  prompts: "prompts"
  reference: "reference"
  output: "output"

# --- File Names ---
file_names:
  project_instructions: "project_skyscanner_exclusions.txt"

  # Agent 1
  system_prompt: "system.txt"
  user_prompt: "user.txt"

  # Agent 2 (validator / final pass)
  system_prompt_2: "system_2.txt"
  user_prompt_2: "user_2.txt"

  # Agent 3 (Summary)
  system_prompt_3: "system_3.txt"
  user_prompt_3: "user_3.txt"

  glossary: "Copy of Skyscanner_Glossary_v2.xlsx"
  output_report_prefix: "LQA_Report"
  edited_output_prefix: "Edited"

# --- Language Mapping ---
# Short codes must match tokens in input filenames (e.g. -pl-, -jp-, -ae-).
lang_map:
  SA: "ar-SA"
  AE: "ar-SA"      # UAE Arabic batch; glossary column ar-SA
  CZ: "cs-CZ"
  GR: "el-GR"
  HU: "hu-HU"
  PL: "pl-PL"
  TH: "th-TH"
  TR: "tr-TR"
  DE: "de-DE"
  ES: "es-ES"
  FR: "fr-FR"
  IT: "it-IT"
  NL: "nl-NL"
  BR: "pt-BR"
  PT: "pt-PT"
  US: "en-US"
  JA: "ja-JP"
  JP: "ja-JP"      # filename uses -jp-
  KO: "ko-KR"
  KR: "ko-KR"      # filename uses -kr-
  MX: "es-MX"
  HR: "hr-HR"
  CH: "zh-CN"      # Chinese Simplified (China)
  TW: "zh-TW"      # Chinese Traditional (Taiwan)

# --- Pipeline / Batching Controls ---
pipeline: &pipeline_defaults
  max_batches_per_window: 100
  window_pause_seconds: 10
  combine_reports_per_language: true
  drop_empty_sections: true

# Back-compat with current script (it reads `batching`)
batching:
  <<: *pipeline_defaults

# --- Selection / Limits (independent of batching windows) ---
limits:
  max_hr_sections_per_language: null
  max_final_batches_per_language: null
  max_words_per_language: null

# Optional scoring config used by the report writer
scoring:
  pass_threshold: 90

# --- Parsing / Batching Mode ---
parsing:
  input_format: "docx"               # "csv" | "docx" | "html" | "auto"
  csv_heading_tag: "h3"              # Split CSV content_html on this tag
  split_mode: "heading"              # DOCX/HTML heading mode
  heading_level_preference: 2        # DOCX H2 batches under H1 URL
  include_parent_h1: "prefix_all"    # HTML-only
  create_intro_batch_if_long: true   # HTML-only
  min_intro_chars: 200               # HTML-only
  allow_fallback_to_h1: false        # HTML-only
